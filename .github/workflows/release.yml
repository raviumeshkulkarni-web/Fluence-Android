name: Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set release tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
        else
          echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign Release APK
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        KS_ALIAS="androiddebugkey"
        KS_PASS="android"
        VALID_KEYSTORE=false

        if [ -n "$KEYSTORE_B64" ]; then
          echo "Decoding release keystore from repository secrets..."
          python3 -c "
import base64, os, re
raw = os.environ.get('KEYSTORE_B64', '')
clean = re.sub(r'[^a-zA-Z0-9+/=]', '', raw)
if clean:
    missing_padding = len(clean) % 4
    if missing_padding:
        clean += '=' * (4 - missing_padding)
    try:
        data = base64.b64decode(clean)
        with open('release.keystore', 'wb') as f:
            f.write(data)
    except Exception as e:
        print(f'Error decoding base64: {e}')
"
          if [ -s release.keystore ] && keytool -list -keystore release.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "Successfully verified secret release keystore!"
            VALID_KEYSTORE=true
          else
            echo "WARNING: Secret RELEASE_KEYSTORE_BASE64 in GitHub Secrets is invalid or incomplete."
          fi
        fi

        if [ "$VALID_KEYSTORE" = "false" ]; then
          echo "Generating fallback release keystore..."
          KS_ALIAS="release-key"
          KS_PASS="password123"
          rm -f release.keystore
          keytool -genkeypair -v -keystore release.keystore -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=GroqVoiceTyper, O=OpenSource, C=US"
        fi

        APKSIGNER=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk} -name "apksigner" -type f | grep -v "\.jar" | head -n 1)
        if [ -z "$APKSIGNER" ]; then
          echo "ERROR: apksigner not found!"
          exit 1
        fi
        echo "Found apksigner at: $APKSIGNER"
        UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" -type f | head -n 1)
        if [ -z "$UNSIGNED_APK" ]; then
          echo "ERROR: No release APK found!"
          exit 1
        fi
        echo "Found unsigned APK at: $UNSIGNED_APK"
        "$APKSIGNER" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out app-release.apk "$UNSIGNED_APK"
        echo "Successfully signed APK as app-release.apk"

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: app-release.apk
        name: Release ${{ env.TAG_NAME }}
        draft: false
        prerelease: ${{ contains(env.TAG_NAME, '-') }}
        body: |
          ## 🎙️ Fluence ${{ env.TAG_NAME }}

          ### 🐛 Bug Fixes & UX Enhancements

          **Smooth Window Expansion on Right Edge**
          - Linked Compose width animation directly to WindowManager X-coordinate repositioning.
          - This eliminates the layout "jumping/wobbling" effect when expanding the bubble on the right edge of the screen, ensuring a buttery-smooth transition.

          **Enhanced Siri-Style Voice Waveform**
          - Added dynamic, physics-based smoothing (using spring animation) to microphone amplitude signals, removing jerky transitions.
          - Implemented frame-rate-independent continuous phase integration for seamless visual wave transitions.
          - Added high-frequency voice vibration paths that trigger and scale dynamically when audio activity is detected.

          **Unused Code Cleanup**
          - Removed unused variables and cleaned up compiler warnings in the service logic.

          ### ✅ Core Features Remain Intact
          - Offline transcription (SenseVoice-Small, ~230MB, fully on-device)
          - Floating bubble overlay with accessibility-based text injection
          - AI Agent / command mode
          - Pre-warm pipeline for instant offline recording start
          - Glass pill UI with animations

          ---

          ### 📦 Installation
          Download `app-release.apk` below and install directly on your Android device (API 26+).
          > You may need to allow **"Install from Unknown Sources"** in your device settings.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
