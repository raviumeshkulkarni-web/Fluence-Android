name: Publish Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set release tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_ENV
        else
          echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Verify versionCode is newer than latest published release
      run: |
        CODE=$(grep -m1 "versionCode" app/build.gradle.kts | awk '{print $3}' | tr -d '"')
        if [ -z "$CODE" ] || ! [ "$CODE" -eq "$CODE" ] 2>/dev/null; then
          echo "ERROR: Could not parse versionCode from app/build.gradle.kts."
          exit 1
        fi
        LATEST_JSON=$(curl -s -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/releases/latest" || true)
        LATEST_URL=$(echo "$LATEST_JSON" | python3 -c "
        import json, sys
        try:
            d = json.load(sys.stdin)
            print(next((a['browser_download_url'] for a in d.get('assets', []) if a['name'] == 'release.json'), ''))
        except Exception:
            print('')
        " 2>/dev/null || true)
        if [ -n "$LATEST_URL" ]; then
          LATEST_CODE=$(curl -s "$LATEST_URL" | python3 -c "
          import json, sys
          try:
              print(json.load(sys.stdin).get('versionCode', 0))
          except Exception:
              print(0)
          " 2>/dev/null || echo 0)
          echo "This release versionCode: $CODE; latest published versionCode: $LATEST_CODE"
          if [ "$CODE" -le "$LATEST_CODE" ]; then
            echo "ERROR: versionCode $CODE is not greater than the latest published versionCode $LATEST_CODE."
            echo "The in-app updater (GitHubUpdateRepository) compares versionCode only; a same-or-lower"
            echo "code release would be invisible to installed apps. Bump versionCode in app/build.gradle.kts."
            exit 1
          fi
          echo "versionCode check passed."
        else
          echo "No previously published release found; skipping versionCode comparison."
        fi
    - name: Sign Release APK
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        KS_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}"
        KS_PASS="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
        KEY_PASS="${{ secrets.RELEASE_KEY_PASSWORD }}"

        if [ -z "$KEYSTORE_B64" ]; then
          echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not set. Cannot sign release APK."
          exit 1
        fi
        if [ -z "$KS_ALIAS" ]; then
          echo "ERROR: RELEASE_KEY_ALIAS secret is not set."
          exit 1
        fi
        if [ -z "$KS_PASS" ]; then
          echo "ERROR: RELEASE_KEYSTORE_PASSWORD secret is not set."
          exit 1
        fi
        if [ -z "$KEY_PASS" ]; then
          echo "ERROR: RELEASE_KEY_PASSWORD secret is not set."
          exit 1
        fi

        echo "Decoding release keystore from repository secrets..."
        python3 -c "import base64, os, re; raw = os.environ.get('KEYSTORE_B64', ''); clean = re.sub(r'[^a-zA-Z0-9+/=]', '', raw); data = base64.b64decode(clean + '=' * ((4 - len(clean) % 4) % 4)) if clean else b''; open('release.keystore', 'wb').write(data)"
        if [ ! -s release.keystore ] || ! keytool -list -keystore release.keystore -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
          echo "ERROR: RELEASE_KEYSTORE_BASE64 in GitHub Secrets is invalid or incomplete."
          exit 1
        fi
        echo "Successfully verified release keystore!"

        APKSIGNER=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk} -name "apksigner" -type f | grep -v "\.jar" | head -n 1)
        if [ -z "$APKSIGNER" ]; then
          echo "ERROR: apksigner not found!"
          exit 1
        fi
        echo "Found apksigner at: $APKSIGNER"
        UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" -type f | head -n 1)
        if [ -z "$UNSIGNED_APK" ]; then
          echo "ERROR: No release APK found!"
          exit 1
        fi
        echo "Found unsigned APK at: $UNSIGNED_APK"
        "$APKSIGNER" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KEY_PASS" --out app-release.apk "$UNSIGNED_APK"
        echo "Successfully signed APK as app-release.apk"

    - name: Verify Release APK Certificate
      run: |
        EXPECTED_SHA256="8955bb6e81047ef452ac68763c47d16916b150a90a743a51ee92ea36b383ca3e"
        if [ ! -f app-release.apk ]; then
          echo "ERROR: app-release.apk not found!"
          exit 1
        fi
        APKSIGNER=$(find ${ANDROID_HOME:-/usr/local/lib/android/sdk} -name "apksigner" -type f | grep -v "\.jar" | head -n 1)
        if [ -z "$APKSIGNER" ]; then
          echo "ERROR: apksigner not found!"
          exit 1
        fi
        CERTS=$("$APKSIGNER" verify --print-certs app-release.apk)
        echo "$CERTS"
        SIGNER_SHA256=$(echo "$CERTS" | sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]\{64\}\).*/\1/p' | head -n 1 | tr '[:upper:]' '[:lower:]')
        if [ -z "$SIGNER_SHA256" ]; then
          echo "ERROR: Could not extract the signing certificate SHA-256 digest from apksigner output."
          exit 1
        fi
        if [ "$SIGNER_SHA256" != "$EXPECTED_SHA256" ]; then
          echo "ERROR: APK signing certificate does not match the documented production certificate."
          echo "Expected SHA-256 fingerprint: $EXPECTED_SHA256"
          echo "Actual SHA-256 fingerprint:   $SIGNER_SHA256"
          exit 1
        fi
        echo "Successfully verified APK signing certificate fingerprint matches the production certificate."

    - name: Extract tag annotation
      id: tag_body
      run: |
        TAG_MSG=$(git tag -l --format='%(contents)' "$TAG_NAME" 2>/dev/null || echo "")
        if [ -z "$TAG_MSG" ]; then
          TAG_MSG="## Fluence $TAG_NAME"$'\n\n'"See the commit history for details."
        fi
        # Write to file to preserve newlines
        echo "$TAG_MSG" > /tmp/tag_body.md

    - name: Generate release.json Metadata Asset
      run: |
        SHA256=$(sha256sum app-release.apk | awk '{print $1}')
        FILE_SIZE=$(stat -c%s app-release.apk)
        VERSION_CODE=$(grep -m1 "versionCode" app/build.gradle.kts | awk '{print $3}' | tr -d '"')
        VERSION_NAME="${TAG_NAME#v}"
        
        cat <<EOF > release.json
        {
          "versionCode": ${VERSION_CODE:-15},
          "versionName": "${VERSION_NAME:-1.5.0}",
          "apkName": "app-release.apk",
          "apkSize": ${FILE_SIZE},
          "sha256": "${SHA256}",
          "mandatory": false
        }
        EOF
        echo "Generated release.json:"
        cat release.json

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: |
          app-release.apk
          release.json
        name: Release ${{ env.TAG_NAME }}
        draft: false
        prerelease: false
        body_path: /tmp/tag_body.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
